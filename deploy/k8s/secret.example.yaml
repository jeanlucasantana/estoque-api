# EXEMPLO. Não faz parte do kustomization e não deve ser aplicado com estes valores.
# Em produção, o Secret vem de um cofre (External Secrets Operator, Azure Key Vault, AWS Secrets Manager).
# Para um teste local, crie com valores próprios:
#   kubectl create namespace estoque
#   kubectl -n estoque create secret generic estoque-api \
#     --from-literal=ConnectionStrings__Estoque='Host=...;Database=estoque;Username=...;Password=...' \
#     --from-literal=Api__Chave="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: estoque-api
  namespace: estoque
type: Opaque
stringData:
  ConnectionStrings__Estoque: "Host=postgres.exemplo;Port=5432;Database=estoque;Username=estoque;Password=troque"
  Api__Chave: "troque-por-uma-chave-aleatoria-de-32-caracteres-ou-mais"

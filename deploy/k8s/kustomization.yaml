# Aplicar: kubectl apply -k deploy/k8s
# Antes, criar o Secret (ver secret.example.yaml) e rodar o Job de migração da versão nova.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: estoque

resources:
  - namespace.yaml
  - configmap.yaml
  - migrations-job.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-pdb.yaml
  - api-hpa.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: estoque
    includeSelectors: false

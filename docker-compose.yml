name: estoque

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      # Na primeira subida, o initdb cria o banco e reinicia o PostgreSQL; com o disco ocupado (por exemplo, com as
      # imagens sendo construídas ao mesmo tempo), isso pode levar mais de um minuto. Falhas nesse período não contam.
      start_period: 120s
      start_interval: 2s

  # Aplica as migrações e termina. A API nunca migra o banco na inicialização:
  # com várias réplicas, cada uma tentaria migrar ao mesmo tempo.
  migrations:
    build:
      context: .
      target: migrations
    # "Gss Encryption Mode=Disable" (aqui e na API): a imagem chiseled não tem a biblioteca do Kerberos. Sem a opção,
    # o Npgsql tenta carregá-la na primeira conexão e escreve um erro falso no log antes de autenticar com senha.
    command: ["--connection", "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable"]
    depends_on:
      postgres:
        condition: service_healthy

  frete:
    image: wiremock/wiremock:3.9.1
    volumes:
      - ./frete_fake:/home/wiremock
    ports:
      - "8081:8080"

  api:
    build:
      context: .
      target: final
    environment:
      # Production por padrão. Com ASPNETCORE_ENVIRONMENT=Development, o documento OpenAPI fica em /openapi/v1.json.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Estoque: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable"
      Api__Chave: ${API_KEY}
      Frete__UrlBase: http://frete:8080
      # Vazio por padrão: sem exportação de telemetria. Para usar o painel abaixo, veja "Observabilidade" no README.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "8080:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
      frete:
        condition: service_started
    restart: unless-stopped

  # Opcional (profile "observabilidade"): painel com traces, métricas e logs recebidos por OTLP.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.5.2
    profiles: ["observabilidade"]
    environment:
      # Só para uso local: o painel abre sem login.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"

volumes:
  postgres-dados:
